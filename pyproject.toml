[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookverdict"
version = "0.1.0"
description = "Run Claude Code hooks against a fake event and see the verdict Claude Code would reach: deny, ask, allow, block or nothing."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jatin Garg"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["claude-code", "hooks", "testing", "ai-agents", "coding-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/jatingargiitk/hookverdict"

[project.scripts]
hookverdict = "hookverdict.cli:main"

[tool.setuptools]
packages = ["hookverdict"]
